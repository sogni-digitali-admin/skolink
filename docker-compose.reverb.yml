version: "3.9"

# Laravel Reverb (self-hosted WebSocket server) override.
# Usage: docker compose -f docker-compose.yml -f docker-compose.reverb.yml up -d

services:
  app:
    environment:
      - BROADCAST_CONNECTION=reverb
      - REVERB_APP_ID=gegok12
      - REVERB_APP_KEY=${REVERB_APP_KEY:-local-reverb-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-local-reverb-secret}
      # Inside the compose network the app reaches Reverb by service name.
      - REVERB_HOST=reverb
      - REVERB_PORT=8080
      - REVERB_SCHEME=http

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: school_reverb
    working_dir: /var/www
    user: "0:0"
    volumes:
      - ./:/var/www
      - ./php.ini:/usr/local/etc/php/conf.d/custom.ini
    environment:
      - APP_ENV=local
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=school
      - DB_USERNAME=root
      - DB_PASSWORD=root
      - REVERB_APP_ID=gegok12
      - REVERB_APP_KEY=${REVERB_APP_KEY:-local-reverb-key}
      - REVERB_APP_SECRET=${REVERB_APP_SECRET:-local-reverb-secret}
      - REVERB_HOST=127.0.0.1
      - REVERB_PORT=8080
      - REVERB_SCHEME=http
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "8080:8080"
    depends_on:
      - app
      - db
    networks:
      - laravel

networks:
  laravel:
